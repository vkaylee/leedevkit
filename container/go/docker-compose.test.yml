services:
  go:
    profiles: ["go"]
    # Dockerfile and GO_VERSION are the only inputs for this image; project
    # source is mounted at runtime and is not copied during the build.
    x-leedevkit-build-inputs:
      - .leedevkit/container/go/Dockerfile
    build:
      context: ../../..
      dockerfile: .leedevkit/container/go/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.24}
    volumes:
      - ../../..:/workspace
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspace
    environment:
      GOTMPDIR: /go-tmp
    tmpfs:
      - /go-tmp:rw,nosuid,nodev,size=1g
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "go", "version"]

volumes:
  go-module-cache:
    name: leedevkit_go-module-cache
  go-build-cache:
    name: leedevkit_go-build-cache

services:
  go:
    profiles: ["go"]
    image: leedevkit-go:${GO_VERSION:-1.26}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26}
    volumes:
      - ${LEEDEVKIT_PROJECT_ROOT:?LEEDEVKIT_PROJECT_ROOT must be set}:/workspace
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspace
    network_mode: "none"
    environment:
      GOTMPDIR: /go-tmp
    tmpfs:
      - /go-tmp:rw,nosuid,nodev,exec,size=1g
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "go", "version"]
      interval: 1s
      timeout: 3s
      retries: 10
  infra:
    profiles: ["infra"]
    image: leedevkit-go:${GO_VERSION:-1.26}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26}
    volumes:
      - ${LEEDEVKIT_PROJECT_ROOT:?LEEDEVKIT_PROJECT_ROOT must be set}:/workspace:ro
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspace
    network_mode: "none"
    environment:
      GOTMPDIR: /go-tmp
    tmpfs:
      - /go-tmp:rw,nosuid,nodev,exec,size=1g
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "go", "version"]
      interval: 1s
      timeout: 3s
      retries: 10

volumes:
  go-module-cache:
    name: leedevkit_go-module-cache
    external: true
  go-build-cache:
    name: leedevkit_go-build-cache
    external: true

services:
  go:
    profiles: ["go"]
    build:
      context: ../../..
      dockerfile: .leedevkit/container/go/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.24}
    volumes:
      - ../../..:/workspace
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspace
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "go", "version"]

volumes:
  go-module-cache:
  go-build-cache:

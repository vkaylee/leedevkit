# =============================================================================
# LeeDevKit — Single-Container Compose Profile
# =============================================================================
# Default compose file for Rust-only projects (library crates, CLI tools, etc.).
# Provides a single service with the Rust toolchain, no database dependencies.
#
# Build context and Dockerfile stay beside this asset; project source mounts
# from the absolute path supplied by the launcher.
#
# For multi-service projects, create your own at .compose/docker-compose.test.yml
# (takes priority over this default).
# =============================================================================

services:
  rust:
    image: leedevkit-rust:${RUST_VERSION:-1.85}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:-1.85}
    volumes:
      - ${LEEDEVKIT_PROJECT_ROOT:?LEEDEVKIT_PROJECT_ROOT must be set}:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/workspace/target
    working_dir: /workspace
    environment:
      - CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-2}
      - CARGO_TARGET_DIR=/workspace/target
      - RUSTC_WRAPPER=
    stdin_open: true
    healthcheck:
      test: ["CMD", "rustc", "--version"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  cargo-registry:
    name: leedevkit_cargo-registry
  cargo-target:
    name: leedevkit_cargo-target

# LeeDevKit Go project profile

[project]
name = "MyGoProject"
namespace = "mygoproject"
languages = ["go"]

[services.go]
lang = "go"
go = true
# workdir = ""
# ports = [8080]
# health_check = "/health"
# go_version = "1.24"

# Optional per-service or per-phase gate overrides:
# [services.go.test]
# integration = ["go", "test", "-tags=integration", "./..."]
#
# [test.dependencies]
# int-go = ["postgres", "redis", "go"]
#
# [test.gates.int-go]
# command = ["go", "test", "-tags=integration", "-count=1", "./..."]

[targets]
go = ["go"]
all = ["go"]

[ai]
extra_rules = []
rules_dir = ".agent/rules"
override_manifest = ".agent/overrides.yaml"

[ai.model_routing]
enabled = false
default_model = "sonnet"

[addons]
skills = []

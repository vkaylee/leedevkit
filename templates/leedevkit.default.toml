# =============================================================================
# LeeDevKit Devkit — Project Profile Schema
# =============================================================================
# Copy to your project root as `leedevkit.toml` and fill in the values.
# Unset fields inherit from the devkit default (templates/.devkit.default.toml).

[project]
name = "MyProject"               # display name
namespace = "myproject"           # unified Compose prefix (<namespace>-test / <namespace>-dev; exported as LEEDEVKIT_TEST_PROJECT)
languages = ["rust", "typescript"] # Go projects use ["go"] or ["go", "typescript"]

# Container selection is explicit. This config declares commands only; runtime
# adapters and capability checks must support the selected provider.
[container]
provider = "docker"

[container.providers.docker]
cli = ["docker"]
compose = ["docker", "compose"]

# Example explicit adapter declaration. Replace command arrays only after
# verifying provider semantics; provider names never imply compatibility.
# [container.providers.kiri]
# cli = ["kiri"]
# compose = ["kiri", "compose"]
# capabilities = ["compose", "config", "up", "down", "ps", "logs", "exec", "run"]

# ── Services ───────────────────────────────────────────────────────────────
# Each service maps to a Docker Compose service + build context.
# Inherited from devkit default; add/override here.

[services.apiserver]
dockerfile = "./apiserver"
lang = "rust"
ports = [3000]
health_check = "/api/v1/health"
cargo = true
# rust_version = "1.85"       # optional — pin Rust toolchain version (default: 1.85)

[services.webdashboard]
dockerfile = "./webdashboard"
lang = "typescript"
ports = [5173]
bun = true

# ── Targets ────────────────────────────────────────────────────────────────
# Logical groups of services for test/manage commands.
# `./test.sh api` tests all services in the "api" target.

[targets]
api = ["apiserver", "agent-main"]
web = ["webdashboard"]
all = ["apiserver", "agent-main", "webdashboard"]

# ── Test image build policy ────────────────────────────────────────────────
# Images build automatically only when missing. When `--build` is passed,
# rebuild each image once per `leedevkit test` invocation, or once per phase.
# Pin `image:` on services in `.compose/docker-compose.test.yml` to reuse images
# across isolated test runs.
[test]
build_policy = "once"

# ── Lifecycle dependencies ─────────────────────────────────────────────────
# Compose services to start and health-check for each lifecycle mode.
# Values must match service names in the project's Compose file; the last entry
# is the target runner container. Declared phases fail closed if no gate/command resolves.
# Go services with `int-*` dependencies default to `go test -tags=integration ./...`.

[test.dependencies]
# "int-go" = ["postgres", "go"]
# "int-api" = ["postgres", "redis", "apiserver"]
# "unit-web" = ["bun_init", "webdashboard"]
# "e2e-web" = ["bun_init", "webdashboard"]
# "lint-web" = ["bun_init", "webdashboard"]

# ── Explicit test gate overrides (optional) ───────────────────────────────
# Override phase commands per phase-key or per service (`[services.<name>.test]`):
# [test.gates.int-api]
# command = ["go", "test", "-tags=integration", "-count=1", "./..."]
#
# [services.apiserver.test]
# integration = ["go", "test", "-tags=integration", "-race", "./..."]

# ── Dev workflow & incremental migrations (optional) ──────────────────────
# `leedevkit dev restart <service>` restarts and waits for `ports` + `health_check`.
# `leedevkit dev watch [service]` watches Go files and auto-restarts on changes.
# `leedevkit dev migrate [up|status]` applies pending SQL files with drift checks,
# or runs a custom command when `[dev.migrate].command` is set.
# [dev]
# auto_migrate = false
# [dev.migrate]
# dir = "migrations"
# db_service = "postgres"
# # Or custom migration runner inside an app service:
# # service = "apiserver"
# # command = ["go", "run", "./cmd/migrate", "up"]
# # status_command = ["go", "run", "./cmd/migrate", "status"]

# ── Test phases ────────────────────────────────────────────────────────────
# Custom test phases specific to this project.
# `cargo test`, `bun test` are auto-detected from service.lang.

[phases.custom]
# Example custom phases:
# integration = { services = ["apiserver"], cmd = "cargo nextest run --test '*'", timeout = 600 }
# e2e = { services = ["webdashboard"], cmd = "bunx playwright test", timeout = 900 }

# ── AI Context ─────────────────────────────────────────────────────────────
# ── Optional generic read-only Debug MCP ────────────────────────────────────
# Configure project-specific values only in an explicit [debug] environment.
# The server never infers an environment, Compose project, network, or service.

# [debug]
# manifest_version = 1
# [debug.environments.test]
# compose_project = "<compose-project>"
# compose_files = ["<compose-file>"]
# profiles = ["debug"]
# approved_networks = ["<approved-network>"]

[ai]
# Rule files to load for AI agents (relative to .agent/rules/).
# The devkit provides base rules; add project-specific ones here.
extra_rules = []

# Harness adapters refreshed during init/update and skill install/update.
# "claude" is historical default; add other targets when used.
# Supported: claude, codex, cursor, gemini, pi, omp.
harnesses = ["claude"]

# Directory for AI rule files (default: ".agent/rules")
rules_dir = ".agent/rules"
# Override manifest: which devkit rules to replace/extend.
override_manifest = ".agent/overrides.yaml"

[ai.model_routing]
enabled = false
default_model = "sonnet"

# ── Community Add-ons (like package.json for AI skills) ───────────────────

[addons]
skills = [
    # { url = "https://github.com/addyosmani/agent-skills.git", version = "main" },
]

name: LeeDevKit Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Go core
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace golang:1.26.11-bookworm go test ./... </dev/null

      - name: Check shell syntax
        run: |
          bash -n install.sh bootstrap.sh bin/leedevkit leedevkit </dev/null

      - name: Run Go regression gate
        run: |
          docker run --rm -e GOPROXY=off -v "$PWD":/workspace -v "$HOME/go/pkg/mod":/go/pkg/mod -w /workspace golang:1.26.11-bookworm go test ./... </dev/null

      - name: Smoke test agent skill utilities
        run: |
          bash -n scripts/test-skill-utilities.sh
          scripts/test-skill-utilities.sh

      - name: Upload quality and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-quality-evidence
          path: |
            .ci-artifacts/**
            .test_logs/**
          include-hidden-files: true
          if-no-files-found: error

  release-acceptance:
    name: Release acceptance
    runs-on: ubuntu-latest
    needs: source-quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare release build
        run: mkdir -p .ci-artifacts/release-dist

      - name: Build, checksum, and accept release artifact
        run: |
          scripts/build-release-go.sh .ci-artifacts/release-dist
          artifact=".ci-artifacts/release-dist/leedevkit-$(tr -d '\n' < VERSION).tar.gz"
          sha256sum "$artifact" > .ci-artifacts/release-artifact.sha256
          cp .ci-artifacts/release-dist/release-sbom.cdx.json .ci-artifacts/release-sbom.cdx.json
          sha256sum .ci-artifacts/release-sbom.cdx.json > .ci-artifacts/release-sbom.sha256


      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-release-evidence
          path: .ci-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn

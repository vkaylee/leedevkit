name: LeeDevKit Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked verification dependencies
        run: |
          mkdir -p logs
          awk '/^# Optional browser harness/{exit} {print}' scripts/requirements.lock > logs/requirements-core.lock
          python -m pip install --requirement logs/requirements-core.lock > logs/run_ci-dependencies.log 2>&1 </dev/null

      - name: Generate supply-chain evidence
        run: |
          mkdir -p logs
          python scripts/_supply_chain_check.py --lock scripts/requirements.lock --output logs/supply-chain.json --container-root . > logs/run_ci-supply-chain.log 2>&1 </dev/null
          python scripts/_sbom.py scripts/requirements.lock "$(tr -d '\n' < VERSION)" logs/sbom.cdx.json > logs/run_ci-sbom.log 2>&1 </dev/null

      - name: Check shell syntax
        run: |
          mkdir -p logs
          bash -n scripts/_ensure-venv.sh install.sh bootstrap.sh bin/leedevkit > logs/run_ci-shell-syntax.log 2>&1 </dev/null

      - name: Check formatting
        run: |
          mkdir -p logs
          ruff format --check scripts > logs/run_ci-format.log 2>&1 </dev/null

      - name: Run lint and type checks
        run: |
          mkdir -p logs
          ruff check scripts > logs/run_ci-ruff.log 2>&1 </dev/null
          mypy scripts > logs/run_ci-mypy.log 2>&1 </dev/null

      - name: Run unit and integration tests
        run: |
          mkdir -p logs
          python -m pytest scripts/tests -q --cov=scripts --cov-report=term-missing --cov-fail-under=80 > logs/run_ci-tests.log 2>&1 </dev/null

      - name: Upload quality and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-quality-evidence
          path: logs/*
          if-no-files-found: error

  release-acceptance:
    name: Release acceptance
    runs-on: ubuntu-latest
    needs: source-quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked acceptance dependencies
        run: |
          mkdir -p logs
          awk '/^# Optional browser harness/{exit} {print}' scripts/requirements.lock > logs/requirements-core.lock
          python -m pip install --requirement logs/requirements-core.lock > logs/run_ci-release-dependencies.log 2>&1 </dev/null

      - name: Build, checksum, and accept release artifact
        run: |
          mkdir -p logs/release-dist
          python3 scripts/_release_build.py --repo-root . --output logs/release-dist > logs/run_ci-release-build.log 2>&1 </dev/null
          artifact="logs/release-dist/leedevkit-$(tr -d '\n' < VERSION).tar.gz"
          sha256sum "$artifact" > logs/release-artifact.sha256
          python3 scripts/_release_acceptance.py --repo-root . --artifact "$artifact" > logs/run_ci-release-acceptance.log 2>&1 </dev/null
          python3 scripts/_sbom.py scripts/requirements.lock "$(tr -d '\n' < VERSION)" logs/release-sbom.cdx.json > logs/run_ci-release-sbom.log 2>&1 </dev/null
          sha256sum logs/release-sbom.cdx.json > logs/release-sbom.sha256


      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-release-evidence
          path: logs/*
          if-no-files-found: error

name: LeeDevKit Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Go core
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace golang:1.26.11-bookworm go test ./... </dev/null

      - name: Check shell syntax
        run: |
          bash -n install.sh bootstrap.sh bin/leedevkit leedevkit templates/leedevkit-wrapper.sh </dev/null

      - name: Run Go regression gate
        run: |
          docker run --rm -e GOPROXY=off -v "$PWD":/workspace -w /workspace golang:1.26.11-bookworm go test ./... </dev/null

      - name: Upload quality and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-quality-evidence
          path: |
            .ci-artifacts/**
            .test_logs/**
          include-hidden-files: true
          if-no-files-found: error

  release-acceptance:
    name: Release acceptance
    runs-on: ubuntu-latest
    needs: source-quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked acceptance dependencies
        run: |
          mkdir -p .ci-artifacts/release-dist
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --requirement scripts/requirements.lock </dev/null

      - name: Build Go core platform binaries
        run: |
          mkdir -p .ci-artifacts/go-core
          .venv/bin/python3 scripts/_go_core_matrix.py \
            --repo-root . \
            --output-dir .ci-artifacts/go-core \
            --version "$(tr -d '\n' < VERSION)" </dev/null

      - name: Build, checksum, and accept release artifact
        run: |
          mkdir -p .ci-artifacts/release-dist
          .venv/bin/python3 scripts/_release_build.py \
            --repo-root . \
            --output .ci-artifacts/release-dist \
            --go-core-dir .ci-artifacts/go-core </dev/null
          artifact=".ci-artifacts/release-dist/leedevkit-$(tr -d '\n' < VERSION).tar.gz"
          sha256sum "$artifact" > .ci-artifacts/release-artifact.sha256
          .venv/bin/python3 scripts/_release_acceptance.py --repo-root . --artifact "$artifact" </dev/null
          .venv/bin/python3 scripts/_sbom.py scripts/requirements.lock "$(tr -d '\n' < VERSION)" .ci-artifacts/release-sbom.cdx.json </dev/null
          sha256sum .ci-artifacts/release-sbom.cdx.json > .ci-artifacts/release-sbom.sha256


      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-release-evidence
          path: .ci-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn

name: LeeDevKit Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    env:
      LEEDEVKIT_PYTHON: .venv/bin/python3
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked verification dependencies
        run: |
          mkdir -p logs
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --requirement scripts/requirements.lock > logs/run_ci-dependencies.log 2>&1 </dev/null

      - name: Generate supply-chain evidence
        run: |
          mkdir -p logs
          .venv/bin/python3 scripts/_supply_chain_check.py --lock scripts/requirements.lock --output logs/supply-chain.json --container-root . > logs/run_ci-supply-chain.log 2>&1 </dev/null
          .venv/bin/python3 scripts/_sbom.py scripts/requirements.lock "$(tr -d '\n' < VERSION)" logs/sbom.cdx.json > logs/run_ci-sbom.log 2>&1 </dev/null

      - name: Check shell syntax
        run: |
          mkdir -p logs
          bash -n scripts/_ensure-venv.sh install.sh bootstrap.sh bin/leedevkit > logs/run_ci-shell-syntax.log 2>&1 </dev/null

      - name: Check formatting
        run: |
          mkdir -p logs
          .venv/bin/ruff format --check scripts > logs/run_ci-format.log 2>&1 </dev/null

      - name: Run lint and type checks
        run: |
          mkdir -p logs
          .venv/bin/ruff check scripts > logs/run_ci-ruff.log 2>&1 </dev/null
          .venv/bin/mypy scripts > logs/run_ci-mypy.log 2>&1 </dev/null

      - name: Run full LeeDevKit regression gate
        run: |
          mkdir -p logs
          ./leedevkit test all --json > logs/run_ci-full-regression.json 2> logs/run_ci-full-regression.log </dev/null
      - name: Emit AI-readable regression events
        if: always()
        run: |
          mkdir -p logs
          ./leedevkit test all --json-stream --quiet > logs/run_ci-full-regression.jsonl 2> logs/run_ci-full-regression-stream.log </dev/null

      - name: Upload quality and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-quality-evidence
          path: logs/*
          if-no-files-found: error

  release-acceptance:
    name: Release acceptance
    runs-on: ubuntu-latest
    needs: source-quality
    env:
      LEEDEVKIT_PYTHON: .venv/bin/python3
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked acceptance dependencies
        run: |
          mkdir -p logs
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --requirement scripts/requirements.lock > logs/run_ci-release-dependencies.log 2>&1 </dev/null

      - name: Build, checksum, and accept release artifact
        run: |
          mkdir -p logs/release-dist
          .venv/bin/python3 scripts/_release_build.py --repo-root . --output logs/release-dist > logs/run_ci-release-build.log 2>&1 </dev/null
          artifact="logs/release-dist/leedevkit-$(tr -d '\n' < VERSION).tar.gz"
          sha256sum "$artifact" > logs/release-artifact.sha256
          .venv/bin/python3 scripts/_release_acceptance.py --repo-root . --artifact "$artifact" > logs/run_ci-release-acceptance.log 2>&1 </dev/null
          .venv/bin/python3 scripts/_sbom.py scripts/requirements.lock "$(tr -d '\n' < VERSION)" logs/release-sbom.cdx.json > logs/run_ci-release-sbom.log 2>&1 </dev/null
          sha256sum logs/release-sbom.cdx.json > logs/release-sbom.sha256


      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-release-evidence
          path: logs/*
          if-no-files-found: error

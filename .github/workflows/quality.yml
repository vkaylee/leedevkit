name: LeeDevKit Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-installer:
    name: macOS installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test global installer on macOS
        run: bash tests/install-test.sh

  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prefetch Go modules into Compose cache volume
        run: |
          set -euo pipefail
          PREFETCH_DIR="$(mktemp -d)"
          trap 'rm -rf "$PREFETCH_DIR"' EXIT
          cp go.mod go.sum "$PREFETCH_DIR/"
          docker run --rm \
            -e GOMODCACHE=/go/pkg/mod \
            -v "$PREFETCH_DIR:/workspace" \
            -v leedevkit_go-module-cache:/go/pkg/mod \
            -w /workspace \
            golang:1.26-bookworm go mod download

      - name: Build current-source CLI in Compose
        env:
          LEEDEVKIT_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          docker volume create leedevkit_go-module-cache >/dev/null
          docker volume create leedevkit_go-build-cache >/dev/null
          mkdir -p .leedevkit-go-build
          docker compose -p leedevkit-source-quality -f container/go/docker-compose.test.yml run --rm -T --no-deps --build -e CGO_ENABLED=0 -e GOPROXY=off go go build -buildvcs=false -o /workspace/.leedevkit-go-build/leedevkit-go ./cmd/leedevkit
          cp .leedevkit-go-build/leedevkit-go "${{ runner.temp }}/leedevkit-go"
          chmod +x "${{ runner.temp }}/leedevkit-go"
          rm -rf .leedevkit-go-build

      - name: Run configured full regression gate
        run: |
          set -euo pipefail
          "${{ runner.temp }}/leedevkit-go" test all --json </dev/null

      - name: Upload quality and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-quality-evidence
          path: |
            .ci-artifacts/**
            .test_logs/**
          include-hidden-files: true
          if-no-files-found: warn

  release-acceptance:
    name: Release acceptance
    runs-on: ubuntu-latest
    needs: source-quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare release build
        run: mkdir -p .ci-artifacts/release-dist

      - name: Build, checksum, and accept release artifact
        run: |
          scripts/build-release-go.sh .ci-artifacts/release-dist
          artifact=".ci-artifacts/release-dist/leedevkit-$(tr -d '\n' < VERSION).tar.gz"
          sha256sum "$artifact" > .ci-artifacts/release-artifact.sha256
          cp .ci-artifacts/release-dist/release-sbom.cdx.json .ci-artifacts/release-sbom.cdx.json
          sha256sum .ci-artifacts/release-sbom.cdx.json > .ci-artifacts/release-sbom.sha256


      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-release-evidence
          path: .ci-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn

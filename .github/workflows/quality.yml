name: LeeDevKit Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    env:
      LEEDEVKIT_PYTHON: .venv/bin/python3
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked verification dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --requirement scripts/requirements.lock </dev/null

      - name: Generate supply-chain evidence
        run: |
          mkdir -p .ci-artifacts
          .venv/bin/python3 scripts/_supply_chain_check.py --lock scripts/requirements.lock --output .ci-artifacts/supply-chain.json --container-root . </dev/null
          .venv/bin/python3 scripts/_sbom.py scripts/requirements.lock "$(tr -d '\n' < VERSION)" .ci-artifacts/sbom.cdx.json </dev/null

      - name: Check shell syntax
        run: |
          bash -n scripts/_ensure-venv.sh install.sh bootstrap.sh bin/leedevkit </dev/null

      - name: Check formatting
        run: |
          .venv/bin/ruff format --check scripts </dev/null

      - name: Run lint and type checks
        run: |
          .venv/bin/ruff check scripts </dev/null
          .venv/bin/mypy scripts </dev/null

      - name: Run full LeeDevKit regression gate
        run: |
          ./bin/leedevkit test all --json </dev/null
      - name: Emit AI-readable regression events
        if: always()
        run: |
          ./bin/leedevkit test all --json-stream --quiet </dev/null

      - name: Upload quality and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-quality-evidence
          path: |
            .ci-artifacts/**
            .test_logs/**
          include-hidden-files: true
          if-no-files-found: error

  release-acceptance:
    name: Release acceptance
    runs-on: ubuntu-latest
    needs: source-quality
    env:
      LEEDEVKIT_PYTHON: .venv/bin/python3
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked acceptance dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --requirement scripts/requirements.lock </dev/null

      - name: Build, checksum, and accept release artifact
        run: |
          mkdir -p .ci-artifacts/release-dist
          .venv/bin/python3 scripts/_release_build.py --repo-root . --output .ci-artifacts/release-dist </dev/null
          artifact=".ci-artifacts/release-dist/leedevkit-$(tr -d '\n' < VERSION).tar.gz"
          sha256sum "$artifact" > .ci-artifacts/release-artifact.sha256
          .venv/bin/python3 scripts/_release_acceptance.py --repo-root . --artifact "$artifact" </dev/null
          .venv/bin/python3 scripts/_sbom.py scripts/requirements.lock "$(tr -d '\n' < VERSION)" .ci-artifacts/release-sbom.cdx.json </dev/null
          sha256sum .ci-artifacts/release-sbom.cdx.json > .ci-artifacts/release-sbom.sha256


      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leedevkit-release-evidence
          path: .ci-artifacts/**
          if-no-files-found: error
